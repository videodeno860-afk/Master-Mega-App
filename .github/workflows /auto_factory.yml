name: 🚀 10 Crore Multi-Category Grand Auto-Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Roz raat ko automatic bina hath lagaye alag-alag apps banakar store par dalega

jobs:
  generate-build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [
          { "id": "com.hub.mega10cr.downloader", "name": "⚡ Super Fast Video Downloader Pro", "category": "Tools", "url": "https://en.savefrom.net" },
          { "id": "com.hub.mega10cr.lyricsmagic", "name": "🎵 Hit Bollywood Song Lyrics 2026", "category": "Books_and_Reference", "url": "https://www.lyrics.com" },
          { "id": "com.hub.mega10cr.gamebooster", "name": "🚀 4X Speed Ultra Game Booster", "category": "Gaming_Tools", "url": "https://www.crazygames.com" },
          { "id": "com.hub.mega10cr.statushub", "name": "🔥 Daily Viral Status & Shayari", "category": "Social_Entertainment", "url": "https://sharechat.com" },
          { "id": "com.hub.mega10cr.bgcleaner", "name": "📸 Magic Photo BG Remover", "category": "Photography", "url": "https://www.remove.bg" },
          { "id": "com.hub.mega10cr.coinchecker", "name": "💰 Crypto & Daily Gold Rate Tracker", "category": "Finance", "url": "https://coinmarketcap.com" }
        ]

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    # 1. AUTOMATIC SOURCE CODE GENERATION STEP (Har Category Ka Alag Android Project)
    - name: 🏗️ Auto-Create Category Android Architecture
      run: |
        mkdir -p app/src/main/java/com/hub
        mkdir -p app/src/main/res/values

        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${{ matrix.app.id }}">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="${{ matrix.app.name }}" android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name="com.hub.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat <<EOF > app/src/main/java/com/hub/MainActivity.java
        package com.hub;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;

        public class MainActivity extends Activity {
            private String unityGameId = "6129135"; 
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("${{ matrix.app.url }}");
                setContentView(webView);
                Toast.makeText(this, "Category: ${{ matrix.app.category }} | Premium Server Active", Toast.LENGTH_LONG).show();
                Toast.makeText(this, "Share with 3 friends on WhatsApp to keep using free!", Toast.LENGTH_LONG).show();
            }
        }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            compileSdk 33
            defaultConfig {
                applicationId "${{ matrix.app.id }}"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🏗️ Compile High-Conversion APK
      run: |
        if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleRelease;
        else echo "Environment prepared for automatic compilation"; fi

    - name: 🌐 Auto Push APK to Releases
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v1.0.${{ github.run_number }}-${{ matrix.app.id }}"
        release_name: "${{ matrix.app.name }} v1.0.${{ github.run_number }}"
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 2. HIGH TRAFFIC AUTOMATIC PUBLIC WEB STORE GENERATION (Google Search Engine Friendly)
    - name: 💻 Auto Generate & Update Public SEO App Store
      run: |
        mkdir -p public
        echo "<html><head><title>🔥 Premium Android Apps Hub 2026 🔥</title></head>" > public/index.html
        echo "<body style='font-family:sans-serif; text-align:center; background:#0f0f16; color:white; padding:40px;'>" >> public/index.html
        echo "<h1 style='color:#FF5722;'>🚀 10 Crore Global App Factory 🚀</h1>" >> public/index.html
        echo "<p>Download official premium utility tools, entertainment hubs, and category-defining applications for free!</p>" >> public/index.html
        echo "<div style='display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; max-width:1200px; margin:40px auto;'>" >> public/index.html
        
        # Adding the current matrix app automatically to the dynamic website view
        echo "<div style='background:#1e1e2f; padding:20px; border-radius:15px; border:2px solid #3d3d5c; text-align:left;'>" >> public/index.html
        echo "<span style='background:#FF9800; padding:4px 8px; border-radius:5px; font-size:12px; font-weight:bold;'>${{ matrix.app.category }}</span>" >> public/index.html
        echo "<h3 style='margin:10px 0;'>${{ matrix.app.name }}</h3>" >> public/index.html
        echo "<p style='font-size:14px; color:#a0a0b0;'>Unity Ads Protection Verified. Click below to download original APK instantly.</p>" >> public/index.html
        echo "<a href='https://github.com/videodeno860-afk/Master-Mega-App/releases/download/v1.0.${{ github.run_number }}-${{ matrix.app.id }}/app-release.apk' style='background:#4CAF50; color:white; padding:12px 20px; text-decoration:none; font-weight:bold; border-radius:8px; display:inline-block; margin-top:10px; width:85%; text-align:center;'>📥 Free Direct Download</a>" >> public/index.html
        echo "</div>" >> public/index.html
        
        echo "</div></body></html>" >> public/index.html

    - name: 🚀 Deploy App Store Website to Live Web
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        
