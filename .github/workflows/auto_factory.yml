name: 🌐 Global Premium Dollar Matrix (Anti-Block)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-deploy-real-network:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code Base
      uses: actions/checkout@v3

    - name: ⚙️ Creating Network Infrastructure
      run: |
        mkdir -p public

    - name: 🏗️ Compiling Premium Multi-Route Dollar Engine
      env:
        MONTAG_LINK: "https://omg10.com/4/11126679"
      run: |
        FINAL_AD_URL="$MONTAG_LINK"

        # --- MASTER USA-PREMIUM PORTAL DESIGN ---
        echo "<!DOCTYPE html><html lang='en'><head><title>🌐 Global Premium Smart Matrix</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#070a13; color:#f1f5f9; font-family:sans-serif; text-align:center; margin:0; padding:20px;} .header{padding:30px 20px;} h1{font-size:2.5rem; color:#fff; text-shadow:0 0 20px rgba(59,130,246,0.5); margin:0 0 10px 0;} .search-container{position:relative; width:90%; max-width:650px; margin:30px auto;} .search-box{width:100%; padding:18px 25px; background:#111827; border:2px solid #eab308; color:#fff; border-radius:50px; font-size:18px; text-align:center; outline:none; box-shadow:0 0 25px rgba(234,179,8,0.25); box-sizing:border-box; transition:0.3s;} .search-box:focus{border-color:#00ffcc; box-shadow:0 0 30px rgba(0,255,204,0.4);} .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:25px; max-width:1200px; margin:40px auto; padding:0 10px;} .site-card{background:#111827; border:1px solid #1f2937; border-radius:16px; padding:25px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 4px 15px rgba(0,0,0,0.2); transition:0.3s;} .site-card:hover{transform:translateY(-5px); border-color:#00ffcc; box-shadow:0 10px 25px rgba(0,255,204,0.15);} .badge{padding:5px 10px; border-radius:6px; font-size:12px; width:fit-content; font-weight:bold; text-transform:uppercase; letter-spacing:0.5px;} .badge.gold{background:rgba(234,179,8,0.15); color:#eab308;} .badge.blue{background:rgba(59,130,246,0.15); color:#3b82f6;} .btn-launch{color:#fff; padding:14px; text-decoration:none; font-weight:bold; border-radius:8px; display:block; text-align:center; margin-top:20px; cursor:pointer; text-transform:uppercase; border:none; font-size:14px; width:100%; letter-spacing:0.5px; transition:0.2s;}</style></head><body>" > public/index.html
        echo "<div class='header'><h1>🌐 GLOBAL PREMIUM SMART MATRIX</h1><p style='color:#94a3b8; font-size:16px;'>Verified Enterprise Network Node for United States & Global Utilities</p></div>" >> public/index.html
        echo "<div class='search-container'><input type='text' id='hubSearch' class='search-box' placeholder='🔍 Search local nodes or hit Enter for Global Matrix Search...' onkeypress='handleKeyPress(event)' oninput='filterTools()'></div>" >> public/index.html
        echo "<div class='grid' id='mainGrid'>" >> public/index.html

        # High-Value USA Targets + Global Fan Utility
        titles=("USA Car Insurance Matrix" "Crypto Investment Node" "Business Loan Fast Center" "Mortgage Rate Calculator" "Live Cricket Score Matrix" "Google Real-Time Map" "World Live Time Clock" "Universal Scientific Calculator" "Wikipedia Fast Search" "Live Currency Converter")
        tags=("HIGH-CPC INSURANCE" "HIGH-CPC CRYPTO" "HIGH-CPC LOANS" "HIGH-CPC MORTGAGE" "GLOBAL SPORTS" "UTILITY MAPS" "UTILITY TIME" "UTILITY MATH" "UTILITY EDUCATION" "UTILITY FINANCE")
        urls=("https://www.geico.com/" "https://coinmarketcap.com/" "https://www.lendingtree.com/" "https://www.mortgagecalculator.org/" "https://cricket.yahoo.com/" "http://googleusercontent.com/maps.google.com/3" "https://time.is/" "https://www.desmos.com/scientific" "https://en.m.wikipedia.org/" "https://www.xe.com/")

        for i in {0..9}; do
          title="${titles[$i]}"
          tag="${tags[$i]}"
          target_url="${urls[$i]}"

          if [[ $tag == *"HIGH-CPC"* ]]; then
            badge_html="<span class='badge gold'>$tag</span>"
            border_color="#eab308"
          else
            badge_html="<span class='badge blue'>$tag</span>"
            border_color="#3b82f6"
          fi

          echo "<div class='site-card' data-title='${title,,}' data-tag='${tag,,}' style='border-top: 4px solid $border_color;'><div>$badge_html<h3 style='margin:15px 0 10px 0; font-size:20px; color:#fff;'>$title</h3><p style='color:#94a3b8; font-size:13px; margin:0;'>Access secure verified global utility pipelines seamlessly.</p></div><div><button onclick=\"bypassAndRedirect('$target_url')\" class='btn-launch' style='background:$border_color;'>🚀 Launch Premium Tool</button></div></div>" >> public/index.html
        done

        # ANTI-BLOCK MULTI-REDIRECT & ENTER KEY HANDLING ENGINE
        echo "</div><script>function bypassAndRedirect(destUrl){ window.location.href = '$FINAL_AD_URL'; setTimeout(function(){ window.location.href = destUrl; }, 850); } function handleKeyPress(e){ if(e.keyCode === 13){ var q = document.getElementById('hubSearch').value.toLowerCase().trim(); if(q.length > 0){ var target = 'https://www.google.com/search?q=' + encodeURIComponent(q); bypassAndRedirect(target); } } } function filterTools(){ var q=document.getElementById('hubSearch').value.toLowerCase().trim(); var cards=document.getElementsByClassName('site-card'); var found=false; for(var i=0; i<cards.length; i++){ var title=cards[i].getAttribute('data-title'); var tag=cards[i].getAttribute('data-tag'); if(title.includes(q) || tag.includes(q)){ cards[i].style.display='flex'; found=true; } else { cards[i].style.display='none'; } } if(!found && q.length > 2){ if(!document.getElementById('ai-card')){ var grid=document.getElementById('mainGrid'); var aiCard=document.createElement('div'); aiCard.className='site-card'; aiCard.id='ai-card'; aiCard.style.border='2px dashed #00ffcc'; aiCard.innerHTML='<div><span class=\'badge\' style=\'background:#00ffcc;color:#000;\'>REAL SEARCH MATRIX</span><h3 id=\'ai-title\' style=\'margin:15px 0 10px 0;color:#fff;\'></h3><p style=\'color:#94a3b8;font-size:13px;\'>No local node found. Click below to route through global verified search pipelines instantly.</p></div><div><button id=\'ai-btn\' class=\'btn-launch\' style=\'background:#00ffcc;color:#000;\'>🚀 Launch Real Search</button></div>'; grid.appendChild(aiCard); } document.getElementById('ai-title').innerText=q+' Premium Node'; document.getElementById('ai-btn').onclick=function(){ bypassAndRedirect('https://www.google.com/search?q='+encodeURIComponent(q)); }; document.getElementById('ai-card').style.display='flex'; } else if(q.length <= 2 && document.getElementById('ai-card')){ document.getElementById('ai-card').style.display='none'; } }</script></body></html>" >> public/index.html
        echo "==== Premium Error-Free Anti-Block System Compiled Successfully ===="

    - name: 🚀 Deploy Live Production Stacks
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        
