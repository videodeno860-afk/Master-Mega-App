name: 🚀 10 Crore Autonomous Lifetime Web App Factory

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # Roz raat ko bina galti ke automatic chale aur scale kare

jobs:
  build-and-deploy-factory:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code Repository
      uses: actions/checkout@v3

    - name: ⚙️ Setup Mass Directory Infrastructure
      run: |
        # Creating folders for 30 high-volume search topics automatically
        mkdir -p public
        mkdir -p public/insta-downloader public/fb-video-saver public/yt-shorts-downloader
        mkdir -p public/free-fire-codes public/pubg-bgmi-redeem public/coin-master-links
        mkdir -p public/sarkari-result-hub public/job-alert-2026 public/exam-admit-card
        mkdir -p public/dream11-prediction public/ipl-live-score public/cricket-news
        mkdir -p public/love-shayari public/attitude-status public/sad-quotes
        mkdir -p public/ai-image-prompt public/chatgpt-hacks public/ai-text-writer
        mkdir -p public/crypto-live public/gold-rate-today public/stock-market-tips
        mkdir -p public/mp3-converter public/pdf-merge-tool public/background-remover
        mkdir -p public/bmi-calc public/calorie-counter public/water-reminder
        mkdir -p public/qr-generator public/age-calculator public/password-generator

    - name: 🏗️ Run Massive Traffic Production Engine
      run: |
        # Fetching network codes from secrets safely
        APPLOVIN_KEY="${{ secrets.APPLOVIN_SDK_KEY }}"
        if [ -z "$APPLOVIN_KEY" ]; then APPLOVIN_KEY="applovin-PENDING"; fi

        YANDEX_ID="${{ secrets.YANDEX_PARTNER_ID }}"
        if [ -z "$YANDEX_ID" ]; then YANDEX_ID="yandex-PENDING"; fi

        ADSTERRA_KEY="${{ secrets.ADSTERRA_SCRIPT_KEY }}"
        if [ -z "$ADSTERRA_KEY" ]; then ADSTERRA_KEY="adsterra-PENDING"; fi

        UNITY_ID="6129135"

        # Anti-Block App-Ads.txt Layer
        echo "applovin.com, account-placeholder, DIRECT" > public/app-ads.txt
        echo "adsterra.com, placeholder-id, DIRECT" >> public/app-ads.txt

        # Multi-Network Revenue Embedder
        inject_triple_ads() {
          local slot_id=$1
          echo "<script src='https://cdn.jsdelivr.net/npm/unity-ads-web-sdk@latest/dist/unity-ads.js'></script>"
          echo "<script src='https://yandex.ru/ads/system/context.js' async></script>"
          echo "<script>"
          echo "  function showInterstitial() { alert('[Adsterra/Unity Interstitial Active]'); }"
          echo "  function showRewarded() { alert('[Unity/AppLovin Video Loading]'); }"
          echo "</script>"
          
          # High CPC Placements
          echo "<div style='background:#1a1a24; margin:15px auto; padding:10px; border:2px dashed #ffcc00; border-radius:6px; text-align:center; max-width:720px; color:#ffcc00; font-size:12px; font-weight:bold;'>🇷🇺 YANDEX DYNAMIC IMPRESSION ZONE ($YANDEX_ID)</div>"
          echo "<div style='background:#11111a; margin:15px auto; padding:10px; border:2px solid #e91e63; border-radius:6px; text-align:center; max-width:720px; color:#e91e63; font-size:12px; font-weight:bold;'>💥 ADSTERRA SMART RATE BANNER ($ADSTERRA_KEY)</div>"
        }

        inject_bottom_triggers() {
          echo "<div style='background:#151522; max-width:720px; padding:15px; margin:20px auto; border:2px solid #ff5722; border-radius:8px; text-align:center;'>"
          echo "  <button onclick='showInterstitial()' style='background:#ff9800; color:white; border:none; padding:10px 20px; font-weight:bold; border-radius:4px; margin:5px; cursor:pointer;'>📺 Load High CPM Interstitial</button>"
          echo "  <button onclick='showRewarded()' style='background:#009688; color:white; border:none; padding:10px 20px; font-weight:bold; border-radius:4px; margin:5px; cursor:pointer;'>💎 Unlock Premium via Video</button>"
          echo "</div>"
        }

        # --- DATABASE OF 30 HIGH-SEARCH KEYWORD PAGES ---
        declare -A titles dirs concepts
        
        dirs[1]="insta-downloader"; titles[1]="📸 Instagram Video & Reels Downloader Pro Online"; concepts[1]="Paste Instagram link to extract high-quality MP4 video instantly."
        dirs[2]="fb-video-saver"; titles[2]="🌐 Facebook HD Video Downloader & Saver Tool"; concepts[2]="Download private and public Facebook videos in one click."
        dirs[3]="yt-shorts-downloader"; titles[3]="⚡ YouTube Shorts & Video Downloader Free Node"; concepts[3]="Fastest server to fetch YouTube videos directly to mobile storage."
        dirs[4]="free-fire-codes"; titles[4]="🎮 Free Fire Max Daily Active Redeem Codes 2026"; concepts[4]="Updated daily list of active Garena Free Fire diamonds and skin codes."
        dirs[5]="pubg-bgmi-redeem"; titles[5]="🚀 BGMI / PUBG Mobile Premium Redeem Center"; concepts[5]="Claim free UC, weapon skins, and custom outfits updates."
        dirs[6]="coin-master-links"; titles[6]="🐷 Coin Master Daily Free Spins & Coins Links"; concepts[6]="Get 25+ free spins and million coin rewards updated every hour."
        dirs[7]="sarkari-result-hub"; titles[7]="📰 Sarkari Result 2026 - Latest Govt Jobs Online"; concepts[7]="Check recent government job forms, application deadlines, and statuses."
        dirs[8]="job-alert-2026"; titles[8]="💼 Free Job Alert - Daily Employment News Hub"; concepts[8]="State-wise and central recruitment notifications for graduates."
        dirs[9]="exam-admit-card"; titles[9]="📅 Download Competitive Exam Admit Cards Live"; concepts[9]="Direct official links to download admit cards and exam dates."
        dirs[10]="dream11-prediction"; titles[10]="🏏 Dream11 Team Prediction & Expert Fantasy Tips"; concepts[10]="Today match playing 11, pitch reports, and grand league captain choices."
        dirs[11]="ipl-live-score"; titles[11]="🔥 Live IPL Match Scorecard & Ball-by-Ball Updates"; concepts[11]="Fastest real-time cricket scoring board and commentary matrix."
        dirs[12]="cricket-news"; titles[12]="📰 Breaking Cricket News, Rumors & Team Updates"; concepts[12]="Latest press releases from ICC, BCCI, and international match insights."
        dirs[13]="love-shayari"; titles[13]="💖 Romantic True Love Shayari & Status for WhatsApp"; concepts[13]="Best Hindi love lines to share with your girlfriend/boyfriend."
        dirs[14]="attitude-status"; titles[14]="😎 Royal Boy & Girl Attitude Status Collection"; concepts[14]="Dabang attitude captions and killer lines for Instagram bios."
        dirs[15]="sad-quotes"; titles[15]="💔 Heartbroken Sad Shayari & Emotional Status"; concepts[15]="Deep painful lines and broken heart status for Facebook profiles."
        dirs[16]="ai-image-prompt"; titles[16]="🤖 Midjourney & Bing AI Art Image Prompt Generator"; concepts[16]="Copy high-converting photorealistic artistic design description scripts."
        dirs[17]="chatgpt-hacks"; titles[17]="🧠 Secret ChatGPT Prompts for Automated Content Writing"; concepts[17]="Unlock full power of AI for blogging, copywriting, and coding."
        dirs[18]="ai-text-writer"; titles[18]="📝 Free AI Paragraph & Essay Rewriter Studio"; concepts[18]="Generate human-like unique text articles within seconds automatically."
        dirs[19]="crypto-live"; titles[19]="💰 Live Bitcoin, Ethereum & Crypto Price Index Tracker"; concepts[19]="Real-time market caps, token dump notifications, and graphs."
        dirs[20]="gold-rate-today"; titles[20]="📈 22K & 24K Gold Rate Today - Live Indian Cities"; concepts[20]="Check current gold and silver price trends per 10 grams."
        dirs[21]="stock-market-tips"; titles[21]="📊 NSE/BSE Stock Market Tips & Intraday Guide"; concepts[21]="Top gaining shares, long-term investments, and market analytics."
        dirs[22]="mp3-converter"; titles[22]="🎵 Universal Video to MP3 Audio Converter Tool"; concepts[22]="Extract crystal clear audio tracks from any video file online."
        dirs[23]="pdf-merge-tool"; titles[23]="📄 Combine PDF Files Online - Free Merge Tool"; concepts[23]="Join multiple documents into a single organized PDF file safely."
        dirs[24]="background-remover"; titles[24]="📸 Auto Image Background Remover AI Engine"; concepts[24]="Make your image backgrounds transparent in under 5 seconds."
        dirs[25]="bmi-calc"; titles[25]="🏃 Online BMI Calculator - Body Mass Index Tracker"; concepts[25]="Check your fitness score based on standard height and weight charts."
        dirs[26]="calorie-counter"; titles[26]="🍎 Daily Food Calorie Counter & Nutrition Analyzer"; concepts[26]="Track your protein, carbs, and fat intake for weight loss goals."
        dirs[27]="water-reminder"; titles[27]="💧 Hydro Tracker - Daily Water Drink Log Reminder"; concepts[27]="Calculate how much water your body needs based on activity levels."
        dirs[28]="qr-generator"; titles[28]="📷 Free URL to Custom Business QR Code Maker"; concepts[28]="Generate high-resolution scannable codes for links or WiFi."
        dirs[29]="age-calculator"; titles[29]="📅 Birth Date Age Calculator - Years, Months, Days"; concepts[29]="Find out exactly how many days you have lived since birth."
        dirs[30]="password-generator"; titles[30]="🔒 Strong Random Password Generator - 100% Secure"; concepts[30]="Create unhackable passwords with symbols and capital letters."

        # WRITING MAIN STOREFRONT INDEX
        echo "<!DOCTYPE html><html><head><title>🚀 Autonomous High-Traffic Search Factory</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'></head><body style='font-family:sans-serif; text-align:center; background:#0b0b11; color:white; padding:20px;'><h1 style='color:#FF5722; font-size:2.2em;'>🚀 10 Crore Unlimited Search-Target App Factory</h1><p style='color:#8c8c9e;'>Unity Ads Enabled | Automated 30 High-Volume Search Network Active</p>" > public/index.html
        inject_triple_ads "Master_Hub" >> public/index.html
        echo "<div style='display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:20px; max-width:1200px; margin:35px auto;'>" >> public/index.html
        
        # Deploying all 30 high-traffic websites in an automated loop
        for i in {1..30}; do
          dir="${dirs[$i]}"
          title="${titles[$i]}"
          desc="${concepts[$i]}"
          
          # Writing sub-site code
          echo "<!DOCTYPE html><html><head><title>$title</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'></head><body style='font-family:sans-serif; text-align:center; background:#111; color:white; padding:20px;'>" > "public/$dir/index.html"
          inject_triple_ads "$dir" >> "public/$dir/index.html"
          echo "<h2 style='color:#00ffcc; margin-top:20px;'>$title</h2>" >> "public/$dir/index.html"
          echo "<div style='background:#222; max-width:500px; margin:30px auto; padding:25px; border-radius:10px; border:1px solid #333;'><p style='color:#e0e0e0; font-size:15px;'>$desc</p><br><input type='text' placeholder='Enter Action Input Here...' style='width:80%; padding:10px; border-radius:5px; border:none;'><br><br><button onclick='alert(\"Processing Dynamic Request...\")' style='background:#4CAF50; color:white; padding:10px 20px; font-weight:bold; border:none; border-radius:5px; cursor:pointer; width:85%;'>Execute Task</button></div>" >> "public/$dir/index.html"
          inject_bottom_triggers >> "public/$dir/index.html"
          echo "</body></html>" >> "public/$dir/index.html"
          
          # Linking sub-site card inside central hub storefront
          echo "<div style='background:#161625; padding:20px; border-radius:12px; border:2px solid #2d2d44; text-align:left;'><h3 style='margin:0 0 8px 0; color:#00ffcc; font-size:15px;'>$title</h3><p style='font-size:12px; color:#a0a0b0; margin-bottom:15px;'>Responsive automated service utility web application node.</p><a href='./$dir/' style='background:#4CAF50; color:white; padding:10px 15px; text-decoration:none; font-weight:bold; border-radius:6px; display:inline-block; width:88%; text-align:center; font-size:12px;'>🌐 Launch High-Traffic App</a></div>" >> public/index.html
        done

        echo "</div>" >> public/index.html
        inject_bottom_triggers >> public/index.html
        echo "</body></html>" >> public/index.html

    # 3. Deploy Ecosystem directly to GitHub Pages Server Nodes
    - name: 🚀 Broadcast and Publish Framework Live
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        
