name: 🌐 100 Unique Searchable Sites with Adsterra Secrets

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-deploy-ultimate-factory:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code Base
      uses: actions/checkout@v3

    - name: ⚙️ Creating Network Directories
      run: |
        mkdir -p public
        for i in {1..100}; do
          mkdir -p "public/site-$i"
        done

    - name: 🏗️ Compiling Smart Hub & 100 Gadget-Packed Sites
      env:
        # GitHub Secrets se tumhari link automatic uthakar yahan pipeline mein lock ho jayegi
        ADSTERRA_LINK: ${{ secrets.ADSTERRA_DIRECT_LINK }}
      run: |
        # Agar secret khali hoga toh default backup chalega taaki error na aaye
        if [ -z "$ADSTERRA_LINK" ]; then
          FINAL_AD_URL="https://omg10.com/4/11126679"
        else
          FINAL_AD_URL="$ADSTERRA_LINK"
        fi

        # --- MASTER HUB WITH SEARCH CORE ---
        echo "<!DOCTYPE html><html lang='en'><head><title>💎 Premium Mega Searchable Network Hub</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#060814; color:#f1f5f9; font-family:'Segoe UI',sans-serif; text-align:center; margin:0; padding:20px;} .header{padding:30px 20px; max-width:1400px; margin:0 auto;} .header h1{font-size:3em; font-weight:800; background:linear-gradient(45deg, #00ffcc, #3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent;} .search-box{width:90%; max-width:600px; padding:15px; background:#0f172a; border:2px solid #1e293b; color:#fff; border-radius:30px; font-size:16px; text-align:center; outline:none; margin:20px auto; transition:0.3s;} .search-box:focus{border-color:#00ffcc; box-shadow:0 0 15px rgba(0,255,204,0.3);} .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:25px; max-width:1400px; margin:30px auto; padding:10px;} .site-card{background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:25px; text-align:left; transition:0.3s;} .site-card:hover{border-color:#00ffcc; transform:translateY(-4px);} .badge{background:rgba(59,130,246,0.1); color:#3b82f6; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:bold;} .btn-launch{background:#00ffcc; color:#060814; padding:12px; text-decoration:none; font-weight:bold; border-radius:6px; display:block; text-align:center; margin-top:20px;} .ad-premium{background:linear-gradient(90deg,#ff0055,#ff5500); color:#fff; padding:10px; text-decoration:none; text-align:center; font-weight:bold; border-radius:6px; display:block; margin-bottom:15px; font-size:12px;}</style></head><body>" > public/index.html
        echo "<div class='header'><h1>🌐 GLOBAL GADGET NETWORK</h1><p style='color:#94a3b8;'>Type your required tool name below. Real-time smart indexing enabled.</p></div>" >> public/index.html
        echo "<input type='text' id='hubSearch' class='search-box' placeholder='🔍 Search 100+ Unique Tools & Apps...' oninput='filterTools()'>" >> public/index.html
        echo "<div style='max-width:650px; margin:0 auto 30px auto; background:rgba(0,255,204,0.02); border:1px solid rgba(0,255,204,0.3); padding:12px; border-radius:8px;'><a href='$FINAL_AD_URL' target='_blank' style='color:#00ffcc; font-weight:bold; text-decoration:none; font-size:14px;'>🔥 CLOUD OPTIMIZATION: ACCELERATE RE-ROUTING NODE BUFFER (AD) 🔥</a></div><div class='grid' id='mainGrid'>" >> public/index.html

        # --- GENERATING THE 100 WEBSITES MATRIX WITH INLINE WIDGET LISTS ---
        for i in {1..100}; do
          dir="site-$i"
          
          case $i in
            1)  title="Universal QR Code Maker Pro"; tag="MARKETING"; desc="Generate dynamic scannable vector images for links."; content="<input type='text' id='in-$i' value='https://' style='width:90%;padding:10px;background:#000;color:#fff;border:1px solid #333;text-align:center;'><br><button style='background:#00ffcc;color:#000;font-weight:bold;padding:10px;margin-top:10px;border:none;width:95%;cursor:pointer;' onclick='var v=document.getElementById(\"in-$i\").value; document.getElementById(\"out-$i\").innerHTML=\"<img src=\\\"https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=\"+encodeURIComponent(v)+\\\" style=\\\\\\\"margin-top:15px;border:4px solid white;\\\\\\\" />\";'>Generate Active QR</button>" ;;
            2)  title="Text Length & Character Counter"; tag="WRITING"; desc="Live paragraph and string analysis metric tracking."; content="<textarea id='in-$i' placeholder='Paste text...' rows='3' style='width:90%;background:#000;color:#fff;border:1px solid #333;' oninput='document.getElementById(\"out-$i\").innerText=\"Chars: \"+this.value.length+\" | Words: \"+this.value.trim().split(/\\s+/).filter(Boolean).length'></textarea>" ;;
            3)  title="Secure Alphanumeric Hash Generator"; tag="SECURITY"; desc="Create uncrackable high-entropy custom security passwords."; content="<button style='background:#3b82f6;color:#fff;font-weight:bold;padding:10px;border:none;width:95%;cursor:pointer;' onclick='var c=\"ABCDEFghijk12345!@#\";var p=\"\";for(var k=0;k<12;k++)p+=c.charAt(Math.floor(Math.random()*c.length));document.getElementById(\"out-$i\").innerText=p;'>Build Key</button>" ;;
            4)  title="Digital Speech Synthesis Studio"; tag="AUDIO"; desc="Convert written layout streams into responsive digital speech."; content="<input type='text' id='in-$i' value='System Active' style='width:90%;padding:10px;background:#000;color:#fff;border:1px solid #333;'><br><button style='background:#00ffcc;padding:10px;margin-top:10px;width:95%;border:none;cursor:pointer;' onclick='var u=new SpeechSynthesisUtterance(document.getElementById(\"in-$i\").value);window.speechSynthesis.speak(u);'>🔊 Speak</button>" ;;
            5)  title="Exact Biological Age Calculator"; tag="UTILITY"; desc="Calculate exact breakdown of timeline age indexes."; content="<input type='date' id='in-$i' style='width:90%;padding:10px;background:#000;color:#fff;border:1px solid #333;'><br><button style='background:#3b82f6;color:#fff;padding:10px;margin-top:10px;width:95%;border:none;cursor:pointer;' onclick='var d=new Date(document.getElementById(\"in-$i\").value);if(d.getTime()){document.getElementById(\"out-$i\").innerText=new Date().getFullYear()-d.getFullYear()+\" Years Old\";}'>Calculate</button>" ;;
            6)  title="Corporate Expense Balance Tracker"; tag="FINANCE"; desc="Track immediate budgets and credit balances."; content="<input type='number' id='inc-$i' placeholder='Income'><input type='number' id='exp-$i' placeholder='Expense'><br><button style='background:#00ffcc;padding:10px;margin-top:10px;width:95%;border:none;cursor:pointer;' onclick='document.getElementById(\"out-$i\").innerText=\"Net Savings: $\"+(Number(document.getElementById(\"inc-$i\").value)-Number(document.getElementById(\"exp-$i\").value));'>Compute Balance</button>" ;;
            7)  title="Random Probability Dice Node"; tag="GAMING"; desc="Roll cryptographic virtual 6-sided dice indexes."; content="<button style='background:#ef4444;color:#fff;padding:12px;border:none;width:95%;cursor:pointer;' onclick='document.getElementById(\"out-$i\").innerText=\"🎲 Result: \"+(Math.floor(Math.random()*6)+1);'>Roll Dice</button>" ;;
            8)  title="High-Precision Electronic Stopwatch"; tag="UTILITY"; desc="Track absolute time intervals via lap ticks."; content="<h2 id='t-$i'>0s</h2><button style='background:#00ffcc;padding:10px;border:none;cursor:pointer;' onclick='var c=0;setInterval(function(){c++;document.getElementById(\"t-$i\").innerText=c+\"s\"},1000);this.style.display=\"none\";'>Start Counter</button>" ;;
            9)  title="Hex to RGB Color Schema Converter"; tag="DESIGN"; desc="Convert hexadecimal layout colors to explicit RGB tables."; content="<input type='text' id='in-$i' value='#00ffcc' style='width:90%;padding:10px;background:#000;color:#fff;border:1px solid #333;text-align:center;'><br><button style='background:#3b82f6;color:#fff;padding:10px;margin-top:10px;width:95%;border:none;cursor:pointer;' onclick='var h=document.getElementById(\"in-$i\").value; if(/^#[0-9A-F]{6}$/i.test(h)){var r=parseInt(h.substring(1,3),16),g=parseInt(h.substring(3,5),16),b=parseInt(h.substring(5,7),16);document.getElementById(\"out-$i\").innerText=\"RGB(\"+r+\",\"+g+\",\"+b+\")\";}'>Convert Hex</button>" ;;
            10) title="Live Currency Simulator Node"; tag="FINANCE"; desc="Simulate global dynamic exchange rates instantly."; content="<button style='background:#00ffcc;padding:10px;border:none;width:95%;cursor:pointer;' onclick='document.getElementById(\"out-$i\").innerText=\"USD to INR Rate: ₹\"+(Math.random()*(85-82)+82).toFixed(2);'>Fetch Simulation Rate</button>" ;;
            *)  title="Advanced Terminal Micro-Service Node"
                tag="AUTOMATION"
                desc="High-performance data computing layout processor."
                content="<input type='text' id='in-$i' placeholder='Input data...' style='width:90%;padding:10px;background:#000;color:#fff;border:1px solid #333;text-align:center;'><br><button style='background:#1e293b;color:#fff;padding:10px;margin-top:10px;width:95%;cursor:pointer;' onclick='var v=document.getElementById(\"in-$i\").value; if(v){document.getElementById(\"out-$i\").innerText=\"Execution Confirmed: Node-$i Active\";}'>Process System</button>" ;;
          esac

          # Search Tags Optimization Layout
          if [ $i -eq 11 ]; then title="Capital Case Text Formatter"; tag="WRITING"; fi
          if [ $i -eq 12 ]; then title="Random Number Picker Pro"; tag="UTILITY"; fi
          if [ $i -eq 13 ]; then title="Website Domain Anchor Checker"; tag="DEV TOOL"; fi
          if [ $i -eq 14 ]; then title="AI Conceptual Prompt Assistant"; tag="AI AGENT"; fi
          if [ $i -eq 15 ]; then title="High-Speed Square Root Evaluator"; tag="MATH"; fi

          # Append Main Hub Card
          echo "<div class='site-card' data-title='${title,,}' data-tag='${tag,,}'><span class='badge'>$tag</span><h3 style='margin:12px 0 8px 0;'>$title</h3><p style='color:#94a3b8;font-size:13px;'>$desc</p><a href='$FINAL_AD_URL' target='_blank' class='ad-premium'>🚀 Server Direct Fast Link (Ad)</a><a href='./$dir/' class='btn-launch'>Launch Live Site</a></div>" >> public/index.html

          # BUILD SEPARATE PACKED SITE WITH UNLIMITED INNER GADGETS
          echo "<html lang='en'><head><title>$title</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#0b0f19; color:#f1f5f9; font-family:sans-serif; text-align:center; padding:20px; margin:0;} .box{background:#111827; border:1px solid #1f2937; max-width:550px; margin:20px auto; padding:30px; border-radius:12px;} .ad-top{background:linear-gradient(90deg, #1d4ed8, #3b82f6); color:#fff; padding:12px; text-decoration:none; display:block; border-radius:6px; font-weight:bold; margin-bottom:20px; font-size:13px;} .btn-back{background:rgba(255,255,255,0.05); color:#94a3b8; border:1px solid rgba(255,255,255,0.1); padding:10px 20px; text-decoration:none; border-radius:6px; font-size:13px;} .sub-grid{display:grid; grid-template-columns:1fr; gap:15px; max-width:550px; margin:30px auto; text-align:left;} .widget-card{background:#1f2937; padding:15px; border-radius:8px; border:1px solid #374151;}</style></head><body>" > "public/$dir/index.html"
          echo "<div class='box'><span style='color:#64748b; font-size:11px; font-weight:bold;'>STATION SITE SLOT #$i</span><h2>$title</h2>" >> "public/$dir/index.html"
          echo "<a href='$FINAL_AD_URL' target='_blank' class='ad-top'>⚙️ Connect Premium Fast Routing Server (Ad)</a>" >> "public/$dir/index.html"
          echo "<div style='margin:20px 0;'>$content</div>" >> "public/$dir/index.html"
          echo "<div id='out-$i' style='margin-top:20px; font-weight:bold; color:#00ffcc; word-break:break-all;'></div></div>" >> "public/$dir/index.html"
          
          # UNLIMITED SIDE GADGETS FEED 
          echo "<div class='sub-grid'><h3>🧰 More Inline Useful Gadgets:</h3>" >> "public/$dir/index.html"
          echo "<div class='widget-card'><h4>📝 Quick Notes Saver</h4><textarea style='width:100%; background:#000; color:#fff; border:1px solid #4b5563;' placeholder='Temporary notes tracker...'></textarea></div>" >> "public/$dir/index.html"
          echo "<div class='widget-card'><h4>🔒 Local String Base64 Masker</h4><input type='text' id='bt-$i' style='width:100%; background:#000; color:white;' placeholder='String...' oninput='document.getElementById(\"bo-$i\").innerText=btoa(this.value)'><p id='bo-$i' style='color:#00ffcc; font-size:12px; margin-top:5px;'></p></div>" >> "public/$dir/index.html"
          echo "</div><br><a href='../' class='btn-back'>⬅️ Back to Main Hub Network</a></body></html>" >> "public/$dir/index.html"
        done

        # INJECTING SEARCH CORE FILTER LOGIC
        echo "</div><script>function filterTools(){ var q=document.getElementById('hubSearch').value.toLowerCase(); var cards=document.getElementsByClassName('site-card'); for(var i=0; i<cards.length; i++){ var title=cards[i].getAttribute('data-title'); var tag=cards[i].getAttribute('data-tag'); if(title.includes(q) || tag.includes(q)){ cards[i].style.display='block'; } else { cards[i].style.display='none'; } } }</script></body></html>" >> public/index.html
        echo "==== Production Core Framework Compiled and Safe with 0 Errors ===="

    - name: 🚀 Deploy Live Production Stacks
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
