name: 🌐 Professional Daily-Essential Global Network

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-deploy-essential-network:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code Core
      uses: actions/checkout@v3

    - name: ⚙️ Booting Global Directories
      run: |
        mkdir -p public
        for i in {1..100}; do
          mkdir -p "public/site-$i"
        done

    - name: 🏗️ Compiling 100 Daily Essential Web Nodes
      run: |
        MONETAG_URL="https://omg10.com/4/11126679"

        # --- MASTER HUB GLOBAL DESIGN (Premium Clean Corporate UI) ---
        echo "<!DOCTYPE html><html lang='en'><head><title>🌐 OpenNode Premium Daily Utilities Network</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#090d16; color:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; text-align:center; margin:0; padding:20px;} .navbar{display:flex; justify-content:space-between; align-items:center; max-width:1400px; margin:0 auto 30px auto; padding:15px; border-bottom:1px solid rgba(255,255,255,0.05);} .brand{font-size:22px; font-weight:bold; color:#00ffcc;} .hero-title{font-size:3em; font-weight:800; background:linear-gradient(135deg, #fff 40%, #00ffcc 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:10px;} .sub{color:#94a3b8; font-size:16px; max-width:800px; margin:0 auto 40px auto; line-height:1.6;} .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:25px; max-width:1400px; margin:0 auto; padding:10px;} .essential-card{background:#111827; border:1px solid #1f2937; border-radius:12px; padding:24px; text-align:left; transition:all 0.3s ease; position:relative;} .essential-card:hover{transform:translateY(-4px); border-color:#00ffcc; box-shadow:0 12px 30px rgba(0,255,204,0.1);} .badge{background:rgba(0,255,204,0.1); color:#00ffcc; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; display:inline-block; margin-bottom:12px;} .btn-action{background:#00ffcc; color:#0b0f19; padding:12px; text-decoration:none; font-weight:bold; border-radius:6px; display:block; text-align:center; margin-top:20px;} .ad-link{background:linear-gradient(90deg, #1e40af, #3b82f6); color:#fff; padding:10px; text-decoration:none; text-align:center; font-weight:bold; border-radius:6px; display:block; margin-bottom:15px; font-size:12px;}</style></head><body>" > public/index.html
        echo "<div class='navbar'><div class='brand'>⚡ OpenNode Essentials</div><div style='color:#64748b; font-size:13px;'>Verified Service Network Active</div></div>" >> public/index.html
        echo "<h1 class='hero-title'>Daily Essential Utility Network</h1><p class='sub'>High-performance, instant web tools engineered for high-volume corporate tasks, content creators, and daily student workflows. Clean, efficient, and unlimited bandwidth architecture.</p>" >> public/index.html
        echo "<div style='max-width:600px; margin:-20px auto 40px auto; background:rgba(0,255,204,0.03); border:1px solid rgba(0,255,204,0.2); padding:14px; border-radius:8px;'><a href='$MONETAG_URL' target='_blank' style='color:#00ffcc; font-weight:bold; text-decoration:none; font-size:14px;'>🚀 CLOUD OPTIMIZATION: ACCELERATE RE-ROUTING NODE BUFFER (AD) 🚀</a></div><div class='grid'>" >> public/index.html

        # --- 2. LOOP TO GENERATE 100 GENUINE HIGH-USE SUB-WEBSITES ---
        for i in {1..100}; do
          dir="site-$i"
          
          # 4 Absolutely Mandatory Daily Essential Tools Distributed cleanly across 100 slots
          if [ $((i % 4)) -eq 0 ]; then
            title="📷 Universal Smart QR Code Generator"
            desc="Create clean, high-resolution scannable QR parameters for business links, UPI payments, or texts instantly."
            content="<input type='text' id='qrIn-$i' value='https://' style='width:92%; padding:12px; background:#000; border:1px solid #333; color:#fff; border-radius:6px; text-align:center;'><br><button style='background:#00ffcc; color:#000; font-weight:bold; border:none; padding:12px 25px; border-radius:6px; margin-top:15px; cursor:pointer; width:95%;' onclick='var v=document.getElementById(\"qrIn-$i\").value; document.getElementById(\"out-$i\").innerHTML=\"<img src=\\\"https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=\"+encodeURIComponent(v)+\\\" style=\\\\\\\"margin-top:20px; border:5px solid #fff;\\\\\\\" />\";'>Generate Secure QR Code</button>"
          elif [ $((i % 4)) -eq 1 ]; then
            title="📝 Pro Word & Character Counter"
            desc="Essential editor tool for writers, students, and SEO managers to analyze text length, paragraph count, and spacing metrics."
            content="<textarea id='txtIn-$i' placeholder='Paste your article, essay, or coding notes here...' rows='4' style='width:92%; padding:12px; background:#000; border:1px solid #333; color:#fff; border-radius:6px;' oninput='document.getElementById(\"out-$i\").innerText=\"Total Characters: \"+this.value.length+ \" | Absolute Words: \"+this.value.trim().split(/\\\\s+/).filter(Boolean).length;'></textarea>"
          elif [ $((i % 4)) -eq 2 ]; then
            title="🔒 High-Security Password Key Builder"
            desc="Generate randomized, crack-proof alphanumeric passwords utilizing local crypto-sandbox keys to secure employee accounts."
            content="<button style='background:linear-gradient(45deg,#3b82f6,#1d4ed8); color:#fff; font-weight:bold; border:none; padding:12px 25px; border-radius:6px; cursor:pointer; width:95%;' onclick='var chars=\"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&\"; var p=\"\"; for(var k=0;k<14;k++) p+=chars.charAt(Math.floor(Math.random()*chars.length)); document.getElementById(\"out-$i\").innerText=\"Generated Master Password Key: \"+p; document.getElementById(\"out-$i\").style.color=\"#00ffcc\";'>Generate Uncrackable Key</button>"
          else
            title="📥 Plain Text To Audio Speech Synthesizer"
            desc="Instantly convert written documentation, articles, or scripts into distinct audible digital voice narratives."
            content="<input type='text' id='spkIn-$i' value='Welcome to OpenNode enterprise system.' style='width:92%; padding:12px; background:#000; border:1px solid #333; color:#fff; border-radius:6px; text-align:center;'><br><button style='background:#00ffcc; color:#000; font-weight:bold; border:none; padding:12px 25px; border-radius:6px; margin-top:15px; cursor:pointer; width:95%;' onclick='var u=new SpeechSynthesisUtterance(document.getElementById(\"spkIn-$i\").value); window.speechSynthesis.speak(u);'>🔊 Execute Voice Broadcast</button>"
          fi

          # Main Hub Structure Cards
          echo "<div class='essential-card'><span class='badge'>DAILY USEFUL NODE</span><h3 style='margin:5px 0 8px 0;'>$title [#$i]</h3><p style='color:#94a3b8; font-size:13px; line-height:1.5;'>$desc</p><a href='$MONETAG_URL' target='_blank' class='ad-link'>⚡ Secure Endpoint Gateway (Ad)</a><a href='./$dir/' class='btn-action'>Open Essential Tool</a></div>" >> public/index.html

          # Corporate Sub-Page Framework
          echo "<html lang='en'><head><title>$title</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#090d16; color:#f1f5f9; font-family:sans-serif; text-align:center; padding:30px;} .box{background:#111827; border:1px solid #1f2937; max-width:550px; margin:40px auto; padding:30px; border-radius:12px;} .ad-top{background:linear-gradient(90deg, #1d4ed8, #3b82f6); color:#fff; padding:12px; text-decoration:none; display:block; border-radius:6px; font-weight:bold; margin-bottom:20px; font-size:13px;} .btn-back{background:rgba(255,255,255,0.05); color:#94a3b8; border:1px solid rgba(255,255,255,0.1); padding:10px 20px; text-decoration:none; border-radius:6px; font-size:13px;}</style></head><body>" > "public/$dir/index.html"
          echo "<div class='box'><span style='color:#64748b; font-size:11px; letter-spacing:1px; font-weight:bold;'>OFFICIAL PRODUCTION MICROSERVICE</span><h2>$title</h2>" >> "public/$dir/index.html"
          echo "<a href='$MONETAG_URL' target='_blank' class='ad-top'>⚙️ Optimize Dedicated Sandbox Server Channel (Ad)</a>" >> "public/$dir/index.html"
          echo "<div style='margin:25px 0;'>$content</div>" >> "public/$dir/index.html"
          echo "<div id='out-$i' style='margin-top:15px; font-weight:bold; font-size:14px; word-break:break-all;'></div></div><br><br><a href='../' class='btn-back'>⬅️ Return to Utility Hub</a></body></html>" >> "public/$dir/index.html"
        done

        echo "</div></body></html>" >> public/index.html
        echo "==== Career Engine Network Compiled Successfully with 0 Errors ===="

    - name: 🚀 Deploy Live Production Stacks
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
