name: 🌐 Ultimate Global Stacks & AI Live Tool Search Factory

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-deploy-global-network:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code Base
      uses: actions/checkout@v3

    - name: ⚙️ Creating Network Infrastructure
      run: |
        mkdir -p public
        for i in {1..105}; do
          mkdir -p "public/site-$i"
        done

    - name: 🏗️ Compiling Smart Engine
      env:
        ADSTERRA_LINK: ${{ secrets.ADSTERRA_DIRECT_LINK }}
      run: |
        if [ -z "$ADSTERRA_LINK" ]; then
          FINAL_AD_URL="https://omg10.com/4/11126679"
        else
          FINAL_AD_URL="$ADSTERRA_LINK"
        fi

        # --- MASTER PORTAL DESIGN ---
        echo "<!DOCTYPE html><html lang='en'><head><title>🌐 Global Premium Tools & Live Sports Hub</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#060814; color:#f1f5f9; font-family:sans-serif; text-align:center; margin:0; padding:20px;} .header{padding:20px;} .search-box{width:90%; max-width:600px; padding:15px; background:#0f172a; border:2px solid #1e293b; color:#fff; border-radius:30px; font-size:16px; text-align:center; outline:none; margin:20px auto; display:block;} .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; max-width:1400px; margin:20px auto;} .site-card{background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:20px; text-align:left;} .badge{background:rgba(59,130,246,0.2); color:#3b82f6; padding:4px 8px; border-radius:4px; font-size:11px;} .btn-launch{background:#00ffcc; color:#060814; padding:10px; text-decoration:none; font-weight:bold; border-radius:6px; display:block; text-align:center; margin-top:15px;} .ad-premium{background:linear-gradient(90deg,#ff0055,#ff5500); color:#fff; padding:8px; text-decoration:none; text-align:center; font-weight:bold; border-radius:6px; display:block; margin-bottom:10px; font-size:12px;}</style></head><body>" > public/index.html
        echo "<div class='header'><h1>🌐 GLOBAL GADGET NETWORK</h1><p style='color:#94a3b8;'>Live Sports Streams & Infinite AI Dynamic Tools Engine</p></div>" >> public/index.html
        echo "<input type='text' id='hubSearch' class='search-box' placeholder='🔍 Search ANY tool or match (e.g., Cricket, Football, Age, PDF, QR)...' oninput='filterTools()'>" >> public/index.html
        echo "<div style='max-width:650px; margin:0 auto 20px auto; background:rgba(0,255,204,0.02); border:1px solid rgba(0,255,204,0.3); padding:10px; border-radius:8px;'><a href='$FINAL_AD_URL' target='_blank' style='color:#00ffcc; font-weight:bold; text-decoration:none; font-size:14px;'>🔥 SERVER OPTIMIZATION NODE Active (Click to Flush Cache) 🔥</a></div>" >> public/index.html
        echo "<div class='grid' id='mainGrid'>" >> public/index.html

        # Arrays for Titles, Tags, and Descriptors
        titles=("Universal QR Maker" "Text Metrics Counter" "Secure Password Builder" "Speech Synthesis Studio" "Exact Age Calculator" "Expense Budget Tracker" "Random Dice Node" "Scientific Stopwatch" "Hex to RGB Converter" "Live Currency Simulator" "Cricket Match Channel 1" "Football Global Stream" "Tennis Championship Live" "Basketball Premium TV" "Motorsports Live Feed" "JSON Data Formatter" "Base64 Stream Decoder" "URL Anchor Purifier" "AI Direct Prompt Builder" "Scientific Root Calculator" "BMI Fitness Analyzer" "Binary Bitstream Encoder" "Regex Expression Tester" "Fahrenheit Thermal Scaler" "Lucky Coin Flipper" "Compound Interest Solver" "Leap Year Evaluator" "HTML Code Escaper" "GST Tax Computator" "UUID Random Token Generator")
        tags=("MARKETING" "WRITING" "SECURITY" "AUDIO" "UTILITY" "FINANCE" "GAMING" "UTILITY" "DESIGN" "FINANCE" "SPORTS" "SPORTS" "SPORTS" "SPORTS" "SPORTS" "DEVELOPER" "DEVELOPER" "SEO" "AI" "MATH" "HEALTH" "DEVELOPER" "DEVELOPER" "UTILITY" "GAMING" "FINANCE" "UTILITY" "DEVELOPER" "FINANCE" "DEVELOPER")

        # Loop to create index cards and actual site configurations efficiently
        for i in {0..29}; do
          t_idx=$i
          title="${titles[$t_idx]}"
          tag="${tags[$t_idx]}"
          dir="site-$((i+1))"

          # Card appending block
          echo "<div class='site-card' data-title='${title,,}' data-tag='${tag,,}'><span class='badge'>$tag</span><h3 style='margin:10px 0;'>$title</h3><a href='$FINAL_AD_URL' target='_blank' class='ad-premium'>🚀 Direct Server Link (Ad)</a><a href='./$dir/' class='btn-launch'>Launch Live</a></div>" >> public/index.html

          # Sub-page layout construction
          echo "<html lang='en'><head><title>$title</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><style>body{background:#0b0f19; color:#f1f5f9; font-family:sans-serif; text-align:center; padding:20px;} .box{background:#111827; border:1px solid #1f2937; max-width:550px; margin:20px auto; padding:30px; border-radius:12px;} .ad-top{background:linear-gradient(90deg, #1d4ed8, #3b82f6); color:#fff; padding:12px; text-decoration:none; display:block; border-radius:6px; font-weight:bold; margin-bottom:20px;} .btn-back{background:rgba(255,255,255,0.05); color:#94a3b8; border:1px solid rgba(255,255,255,0.1); padding:10px 20px; text-decoration:none; border-radius:6px;}</style></head><body><div class='box'><span>STATION NODE SLOT $((i+1))</span><h2>$title</h2><a href='$FINAL_AD_URL' target='_blank' class='ad-top'>⚙️ Premium Multi-Channel Routing Link (Ad)</a>" > "public/$dir/index.html"
          
          if [ "$tag" = "SPORTS" ]; then
            echo "<div style='background:#000; padding:40px 10px; color:#ff0055; font-weight:bold; border:2px dashed #ff0055;'>📺 LIVE MATCH SPORTS STREAM CHANNELS ACTIVE<br><br><span style='color:#fff;font-size:13px;'>[Server Link Synced with Global Sports Feed Nodes]</span><br><br><button onclick='location.href=\"$FINAL_AD_URL\"' style='background:#ff0055;color:#fff;border:none;padding:10px 20px;cursor:pointer;font-weight:bold;'>CLICK TO RE-FRESH STREAMS PLAYER (AD)</button></div>" >> "public/$dir/index.html"
          else
            echo "<input type='text' placeholder='Enter inputs...' style='width:90%;padding:10px;background:#000;color:#fff;border:1px solid #333;text-align:center;'><br><button style='background:#3b82f6;color:white;padding:10px;margin-top:10px;width:95%;border:none;' onclick='alert(\"Engine Execution Confirmed.\"); location.href=\"$FINAL_AD_URL\"'>Process Request</button>" >> "public/$dir/index.html"
          fi
          echo "</div><br><a href='../' class='btn-back'>⬅️ Back to Global Hub</a></body></html>" >> "public/$dir/index.html"
        done

        # --- GENERATE EXTENDED MATRIX (31 TO 100) VIA LOOP ---
        for i in {31..100}; do
          dir="site-$i"
          echo "<div class='site-card' data-title='utility core module node-$i' data-tag='automation'><span class='badge'>AUTOMATION</span><h3 style='margin:10px 0;'>Utility Module Node-$i</h3><a href='$FINAL_AD_URL' target='_blank' class='ad-premium'>🚀 Direct Server Link (Ad)</a><a href='./$dir/' class='btn-launch'>Launch Live</a></div>" >> public/index.html
          echo "<html lang='en'><head><title>Module $i</title></head><body style='background:#0b0f19;color:#fff;text-align:center;padding:5px;'><div style='background:#111827;padding:30px;max-width:500px;margin:40px auto;border-radius:12px;'><h2>Enterprise Module Unit $i</h2><a href='$FINAL_AD_URL' target='_blank' style='color:#00ffcc;'>[Click to Unlock Premium Access Node (Ad)]</a><br><br><input type='text' style='width:90%;'><br><button onclick='location.href=\"$FINAL_AD_URL\"'>Execute Node Process</button></div></body></html>" > "public/$dir/index.html"
        done

        # --- ADVANCED SEARCH ENGINE & AUTOMATIC ON-DEMAND AI CARD CREATOR LOGIC ---
        echo "</div><script>function filterTools(){ var q=document.getElementById('hubSearch').value.toLowerCase().trim(); var cards=document.getElementsByClassName('site-card'); var found=false; for(var i=0; i<cards.length; i++){ var title=cards[i].getAttribute('data-title'); var tag=cards[i].getAttribute('data-tag'); if(title.includes(q) || tag.includes(q)){ cards[i].style.display='block'; found=true; } else { cards[i].style.display='none'; } } if(!found && q.length > 2){ if(!document.getElementById('ai-card')){ var grid=document.getElementById('mainGrid'); var aiCard=document.createElement('div'); aiCard.className='site-card'; aiCard.id='ai-card'; aiCard.style.border='2px dashed #00ffcc'; aiCard.style.background='linear-gradient(135deg, #0f172a, #060814)'; aiCard.innerHTML='<span class=\'badge\' style=\'background:#00ffcc;color:#000;\'>AI GENERATED</span><h3 id=\'ai-title\' style=\'margin:10px 0;text-transform:capitalize;\'></h3><p style=\'color:#94a3b8;font-size:12px;\'>This global tool was missing. Our AI Engine has automatically constructed it for you live!</p><a href=\'$FINAL_AD_URL\' target=\'_blank\' class=\'ad-premium\'>⚡ Unlock AI Tool Access Server (Ad)</a><a href=\'$FINAL_AD_URL\' class=\'btn-launch\' style=\'background:#00ffcc;color:#000;\'>Instant Launch Live</a>'; grid.appendChild(aiCard); } document.getElementById('ai-title').innerText=q+' Premium Micro-SaaS'; document.getElementById('ai-card').style.display='block'; } else if(q.length <= 2 && document.getElementById('ai-card')){ document.getElementById('ai-card').style.display='none'; } }</script></body></html>" >> public/index.html
        echo "==== AI Smart Framework and Multi-Sports Channels Activated ===="

    - name: 🚀 Deploy Live Production Stacks
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
        
