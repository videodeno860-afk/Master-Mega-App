name: Ultimate One-Click Master Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clone Code From Repository
      uses: actions/checkout@v4

    - name: 2. Setup Java Environment (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Setup Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: 4. Setup Global Gradle Build Engine
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.0.2

    - name: 5. Auto-Create Structure, Files, Icons & Licenses
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-34" "build-tools;34.0.0"
        
        mkdir -p app/src/main/java/com/master/megaapp
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "android.useAndroidX=true" > gradle.properties
        
        # 📄 1. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "Master-Mega-App"
        include ':app'
        EOF
        
        # 📄 2. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.0.2' apply false
            id 'com.android.library' version '8.0.2' apply false
        }
        EOF
        
        # 📄 3. App module build.gradle (Zero Error Bypass Filters)
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.master.megaapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.master.megaapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
            signingConfigs {
                release {
                    storeFile file("../release.keystore")
                    storePassword "masterpass123"
                    keyAlias "masterkey"
                    keyPassword "masterpass123"
                }
            }
            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation 'com.unity3d.ads:unity-ads:4.12.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF
        
        # 📄 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="Mega Hub 10Cr Apps"
                android:supportsRtl="true"
                android:theme="@style/MasterMegaTheme"
                android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 📄 5. SELF-CONTAINED HIGH-PERFORMANCE WEB ENGINE (No External Config File Needed)
        cat << 'EOF' > app/src/main/java/com/master/megaapp/MainActivity.java
        package com.master.megaapp;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebChromeClient;
        import android.widget.FrameLayout;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import com.unity3d.ads.UnityAds;
        
        public class MainActivity extends AppCompatActivity {
            private String unityGameId = "6129135"; 
            private boolean testMode = false; 
            private WebView myWebView;
        
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                FrameLayout rootLayout = new FrameLayout(this);
                rootLayout.setLayoutParams(new FrameLayout.LayoutParams(-1, -1));
                myWebView = new WebView(this);
                myWebView.setLayoutParams(new FrameLayout.LayoutParams(-1, -1));
                rootLayout.addView(myWebView);
                setContentView(rootLayout);
                
                WebSettings settings = myWebView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setJavaScriptCanOpenWindowsAutomatically(true);
                settings.setLoadWithOverviewMode(true);
                settings.setUseWideViewPort(true);
                settings.setBuiltInZoomControls(true);
                settings.setDisplayZoomControls(false);
                
                myWebView.setWebViewClient(new WebViewClient());
                myWebView.setWebChromeClient(new WebChromeClient());
                
                // 🚨 IN-APP SELF GENERATING DASHBOARD SCRIPT: Loaded locally inside code!
                String customHtmlData = "<html><head><meta name='viewport' content='width=device-width, initial-scale=1.0'>"
                    + "<style>body{background-color:#121212;color:white;font-family:sans-serif;text-align:center;padding:10px;}"
                    + ".grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px;}"
                    + ".btn{background:linear-gradient(135deg,#ff9900,#ff5500);color:white;padding:20px 10px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px;box-shadow:0 4px 6px rgba(0,0,0,0.3);display:block;}"
                    + "h2{color:#ff9900;margin-bottom:2px;}p{font-size:12px;color:#aaa;margin-top:0;}</style></head><body>"
                    + "<h2>MEGA APP FACTORY HUB</h2><p>10 Crore Apps & Digital Tools Active</p>"
                    + "<div class='grid'>"
                    + "<a class='btn' href='https://www.google.com/search?q=trending+ai+tools'>🤖 AI Prompts & Tools</a>"
                    + "<a class='btn' href='https://apkpure.com/trending'>🔥 Trending Apps Store</a>"
                    + "<a class='btn' href='https://www.photopea.com'>🎨 Image & Graphics Editors</a>"
                    + "<a class='btn' href='https://www.ilovepdf.com'>📄 Ultimate PDF Converters</a>"
                    + "<a class='btn' href='https://www.crazygames.com'>🎮 10,000+ Instant Games</a>"
                    + "<a class='btn' href='https://www.wikipedia.org'>📚 Knowledge & Tech Hub</a>"
                    + "<a class='btn' href='https://tinypng.com'>⚡ Fast Media Compressors</a>"
                    + "<a class='btn' href='https://baconipsum.com'>🛠️ Dev Multi-Tool Kits</a>"
                    + "</div></body></html>";
                
                myWebView.loadDataWithBaseURL(null, customHtmlData, "text/html", "UTF-8", null);
        
                try {
                    UnityAds.initialize(getApplicationContext(), unityGameId, testMode);
                } catch (Exception e) {}
                
                Toast.makeText(this, "Self-Contained Master Hub Active!", Toast.LENGTH_SHORT).show();
            }
            
            @Override
            public void onBackPressed() { 
                if (myWebView.canGoBack()) { myWebView.goBack(); } else { super.onBackPressed(); } 
            }
        }
        EOF
        
        # 🎨 Styles & System Icons
        echo '<resources><style name="MasterMegaTheme" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > app/src/main/res/values/styles.xml
        echo -e '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp"\n    android:height="108dp"\n    android:viewportWidth="108"\n    android:viewportHeight="108">\n  <path\n      android:fillColor="#121212"\n      android:pathData="M0,0h108v108h-108z"/>\n</vector>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_background.xml
        echo -e '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp"\n    android:height="108dp"\n    android:viewportWidth="108"\n    android:viewportHeight="108">\n  <path\n      android:fillColor="#FFD700"\n      android:pathData="M30,30h48v48h-48z"/>\n</vector>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml
        echo -e '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        echo -e '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        
        # 🔑 Keystore Signer
        keytool -genkeypair -v -keystore release.keystore -alias masterkey -keyalg RSA -keysize 2048 -validity 10000 -storepass masterpass123 -keypass masterpass123 -dname "CN=master, OU=megaapp, O=factory, L=delhi, S=delhi, C=IN"

    - name: 6. Force Sync Project & Compile Release Signed APK
      run: |
        gradle projects --no-daemon
        gradle :app:assembleRelease --no-daemon

    - name: 7. Deliver Signed Production .APK to User
      uses: actions/upload-artifact@v4
      with:
        name: Fully-Automated-MegaHub-Signed-APK
        path: app/build/outputs/apk/release/*.apk
        
